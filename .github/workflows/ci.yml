# ci:validates all
# ci.yml holds prepare, lint and ci-ok — it decides how every job runs, so every job proves it.
name: Continuous Integration

on:
  push:
    branches:
      - 'main'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect node version / package manager once and which areas changed, then
  # expose everything as outputs the other jobs reuse via needs.prepare.outputs.*
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    outputs:
      node_version: ${{ steps.node-version.outputs.version }}
      manager: ${{ steps.detect-package-manager.outputs.manager }}
      command: ${{ steps.detect-package-manager.outputs.command }}
      runner: ${{ steps.detect-package-manager.outputs.runner }}
      playwright_version: ${{ steps.detect-playwright.outputs.version }}
      web: ${{ steps.assemble.outputs.web }}
      editor: ${{ steps.assemble.outputs.editor }}
      has_packages: ${{ steps.assemble.outputs.has_packages }}
      changed_packages: ${{ steps.assemble.outputs.changed_packages }}
      has_workers: ${{ steps.assemble.outputs.has_workers }}
      changed_workers: ${{ steps.assemble.outputs.changed_workers }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Read Node.js version from .nvmrc
        id: node-version
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/pnpm-lock.yaml" ]; then
            echo "manager=pnpm" >> $GITHUB_OUTPUT
            echo "command=install --frozen-lockfile" >> $GITHUB_OUTPUT
            echo "runner=pnpm" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install --frozen-lockfile --non-interactive" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npm" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi

      - name: Read Playwright version from package.json
        id: detect-playwright
        run: |
          VERSION=$(node -p "require('./apps/web/package.json').devDependencies?.['@playwright/test'] || require('./apps/web/package.json').dependencies?.['@playwright/test']")
          echo "version=${VERSION#^}" >> "$GITHUB_OUTPUT"

      # One key per app / worker / package (folders with a package.json), per workflow file,
      # and per root file — each root file is its own key so what changed can be attributed
      # rather than read as "everything". Root docs/tooling dotfiles are deliberately absent:
      # they must not validate the workspace, so the list is explicit rather than a glob.
      - name: Discover workspace entities
        id: discover
        run: node scripts/assemble-changes.mjs filters >> "$GITHUB_OUTPUT"

      - name: Detect changed entities
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
        id: filter
        with:
          filters: ${{ steps.discover.outputs.filters }} # JSON is valid YAML

      # The root manifest and the lockfile are attributed by comparing them against the
      # base — the target branch for a pull request, the previous tip for a push — so both
      # are copied out at that commit, fetched one deep first when the shallow clone lacks
      # it. Every step here may fail without failing the job: a copy that is missing or
      # empty is one the next step reads as "cannot be compared", which validates
      # everything. Reading is git's job; what it means is the script's.
      - name: Copy the base manifest and lockfile
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          mkdir -p "$RUNNER_TEMP/base"
          git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null ||
            git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null || true
          git show "$BASE_SHA:package.json"   > "$RUNNER_TEMP/base/package.json"   2>/dev/null || true
          git show "$BASE_SHA:pnpm-lock.yaml" > "$RUNNER_TEMP/base/pnpm-lock.yaml" 2>/dev/null || true

      # Assemble the single changes.json the CD workflows read: apps/worker/packages/
      # workflows are lists of the changed names, root is a boolean. Also derive the
      # per-area matrices and the booleans this run's caller jobs gate on.
      - name: Assemble changes.json
        id: assemble
        env:
          CHANGES: ${{ steps.filter.outputs.changes }}
          BASE_PACKAGE_JSON: ${{ runner.temp }}/base/package.json
          BASE_LOCKFILE: ${{ runner.temp }}/base/pnpm-lock.yaml
        run: node scripts/assemble-changes.mjs assemble >> "$GITHUB_OUTPUT"

      # Hand the single changes.json to the workflow_run-triggered CD workflows; they
      # carry no diff base of their own and read this run's answer (computed against
      # github.event.before..after) to decide whether to deploy/publish.
      - name: Upload changes.json
        uses: actions/upload-artifact@v7
        with:
          name: changes
          path: changes.json

  # Lint + typecheck the whole workspace once (cheap, recursive).
  lint:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup pnpm
        if: needs.prepare.outputs.manager == 'pnpm'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ needs.prepare.outputs.node_version }}
          cache: ${{ needs.prepare.outputs.manager }}

      - name: Install dependencies
        env:
          CI: true
        run: ${{ needs.prepare.outputs.manager }} ${{ needs.prepare.outputs.command }}

      - name: Run Lint
        run: ${{ needs.prepare.outputs.runner }} run lint

      - name: Run Typecheck
        run: ${{ needs.prepare.outputs.runner }} run typecheck

      # Fail the build if a publishable package bumped its version without adding the matching
      # release-notes/<version>.md — the same file cd-packages.yml requires before publishing.
      - name: Check release notes
        run: ${{ needs.prepare.outputs.runner }} run check:release-notes

  # Each area's jobs live in a workflow of its own, called from here rather than triggered
  # separately: `needs:` cannot cross workflow files, and `ci-ok` has to stay able to see every
  # job. Calling them keeps one run, one CI-environment approval wave and one required check —
  # and gives each area a file whose own `# ci:validates` marker says what editing it re-runs.
  #
  # `secrets: inherit` is not decoration: CODECOV_TOKEN is scoped to the CI environment, and
  # naming it explicitly here would evaluate it in this workflow's environment-less context and
  # pass an empty string — a green upload step that uploads nothing.
  packages:
    needs: [prepare, lint]
    if: needs.prepare.outputs.has_packages == 'true'
    uses: ./.github/workflows/ci-packages.yml
    permissions:
      contents: read
      pull-requests: write # bench-action posts/updates the results comment
      id-token: write # OIDC token for the branded comment relay
    secrets: inherit
    with:
      node_version: ${{ needs.prepare.outputs.node_version }}
      manager: ${{ needs.prepare.outputs.manager }}
      command: ${{ needs.prepare.outputs.command }}
      runner: ${{ needs.prepare.outputs.runner }}
      playwright_version: ${{ needs.prepare.outputs.playwright_version }}
      changed_packages: ${{ needs.prepare.outputs.changed_packages }}

  worker:
    needs: [prepare, lint]
    if: needs.prepare.outputs.has_workers == 'true'
    uses: ./.github/workflows/ci-worker.yml
    permissions:
      contents: read
    secrets: inherit
    with:
      node_version: ${{ needs.prepare.outputs.node_version }}
      manager: ${{ needs.prepare.outputs.manager }}
      command: ${{ needs.prepare.outputs.command }}
      runner: ${{ needs.prepare.outputs.runner }}
      changed_workers: ${{ needs.prepare.outputs.changed_workers }}

  app:
    needs: [prepare, lint]
    if: needs.prepare.outputs.web == 'true' || needs.prepare.outputs.editor == 'true'
    uses: ./.github/workflows/ci-app.yml
    permissions:
      contents: read
      id-token: write # the apps upload their coverage tokenlessly
    secrets: inherit
    with:
      node_version: ${{ needs.prepare.outputs.node_version }}
      manager: ${{ needs.prepare.outputs.manager }}
      command: ${{ needs.prepare.outputs.command }}
      runner: ${{ needs.prepare.outputs.runner }}
      playwright_version: ${{ needs.prepare.outputs.playwright_version }}
      web: ${{ needs.prepare.outputs.web }}
      editor: ${{ needs.prepare.outputs.editor }}

  # Single stable status check for branch protection: tolerates change-gated jobs
  # being skipped, fails only if a required job actually failed or was cancelled.
  # Every job reaches it through one of the caller jobs above.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [prepare, lint, packages, worker, app]
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Require all jobs to pass
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "A required job failed or was cancelled."
          exit 1

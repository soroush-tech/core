# ci:validates pkg__*
# Editing this file re-runs the package matrix it holds, and nothing outside it.
name: CI · Packages

# Called by ci.yml. One row per changed package: install, run its `test:coverage`, upload its
# lcov under its own Codecov flag. Packages are alike, so they are a matrix rather than a job
# each - a new package appears here without this file being touched.
on:
  workflow_call:
    inputs:
      node_version: { required: true, type: string }
      manager: { required: true, type: string }
      command: { required: true, type: string }
      runner: { required: true, type: string }
      playwright_version: { required: true, type: string }
      changed_packages: { required: true, type: string }

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: CI
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.changed_packages) }}
    # Same pinned browser location as the `web`/`e2e` jobs so browser-tier package rows
    # share their Playwright cache.
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/ms-playwright
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm, Node and dependencies
        uses: ./.github/actions/setup
        with:
          node_version: ${{ inputs.node_version }}
          manager: ${{ inputs.manager }}
          command: ${{ inputs.command }}

      # As in ci-web.yml: after the install, which touches nothing on this path.
      - name: Restore cache - Playwright binaries
        if: matrix.browsers
        uses: actions/cache/restore@v6
        id: playwright-cache
        with:
          path: ${{ github.workspace }}/ms-playwright
          key: ${{ runner.os }}-playwright-${{ inputs.playwright_version }}

      # Only Chromium is needed - the browser test tier runs headless Chromium.
      - name: Install Playwright browsers
        if: matrix.browsers && steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter ${{ matrix.filter }} exec playwright install --with-deps chromium

      # On a cache hit the binaries are restored, but Linux system libs live outside the cache.
      - name: Install Playwright system deps
        if: matrix.browsers && steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter ${{ matrix.filter }} exec playwright install-deps chromium

      - name: Save cache - Playwright binaries
        if: always() && matrix.browsers && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/ms-playwright
          key: ${{ runner.os }}-playwright-${{ inputs.playwright_version }}

      - name: Run Tests with Coverage
        run: ${{ inputs.runner }} --filter ${{ matrix.filter }} test:coverage

      # The source tiers all typecheck `src/`; only `test:types` builds `dist` and compiles a
      # consumer-shaped program against the emitted d.ts, which is where bundling can drop a
      # type that `src/` resolves fine. `--if-present` skips the packages that declare no such
      # script.
      - name: Typecheck Published Declarations
        run: ${{ inputs.runner }} --filter ${{ matrix.filter }} run --if-present test:types

      # vitest writes lcov paths relative to the member (e.g. SF:src/index.ts), which is
      # ambiguous across the monorepo - Codecov can't map a lone src/index.ts (five exist)
      # and silently drops the flag's coverage. Prefix with the member's own directory so paths
      # are repo-relative and unique. Both via env (never spliced into the shell).
      - name: Make lcov paths repo-relative for Codecov
        env:
          AREA: ${{ matrix.area }}
          DIR: ${{ matrix.dir }}
        run: sed -i "s#^SF:#SF:$AREA/$DIR/#" "$AREA/$DIR/coverage/lcov.info"

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./${{ matrix.area }}/${{ matrix.dir }}/coverage/lcov.info
          slug: soroush-tech/core
          flags: ${{ matrix.flag }}
          name: ${{ matrix.flag }}

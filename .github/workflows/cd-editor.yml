# ci:validates nothing
# Packages the desktop editor and publishes one GitHub Release.
name: CD · Editor (release)

# Manual only - a release is a decision, not a side effect of a merge, and
# approving the dispatch is the release act. The two build legs upload their
# installers as workflow artifacts; a final job assembles them into a single
# release tagged v<version> (from apps/editor's package.json), titled and with
# notes read from apps/editor/release-notes/<version>.md, and publishes it -
# the moment running apps start seeing the update.
on:
  workflow_dispatch:

concurrency:
  group: cd-editor
  cancel-in-progress: false # never abort an in-flight release build

jobs:
  build:
    # Dispatch is manual, but only from main: any other ref would release code
    # CI has not validated as the release line.
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    environment: cd-editor
    timeout-minutes: 30 # notarization waits on Apple
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read Node.js version from .nvmrc
        shell: bash
        run: |
          if [ -f "${{ github.workspace }}/.nvmrc" ]; then
            echo "NODE_VERSION=$(cat ${{ github.workspace }}/.nvmrc)" >> "$GITHUB_ENV"
          else
            echo ".nvmrc file not found"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # --ignore-scripts, as in the bench deploy: no lifecycle script runs at
      # install. Nothing here needs one - electron-builder downloads its own
      # Electron for packaging, and esbuild's binary ships as a platform package.
      - name: Install dependencies
        env:
          CI: true
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Both legs build unsigned for now: Windows by choice (SmartScreen warns
      # until a signature or reputation arrives), macOS because there is no
      # Apple Developer account yet - see electron-builder.yml's `identity` /
      # `notarize` and the runbook's "when the Apple account exists" section
      # for what returns here with one.
      - name: Build installers
        run: pnpm --filter @soroush/editor dist

      # Only what the release (and electron-updater) needs: the installers,
      # their blockmaps, and the latest*.yml update manifests. The unpacked app
      # directories stay behind.
      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: editor-${{ runner.os }}
          if-no-files-found: error
          path: |
            apps/editor/release/*.exe
            apps/editor/release/*.dmg
            apps/editor/release/*.zip
            apps/editor/release/*.blockmap
            apps/editor/release/latest*.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # creates and publishes the GitHub Release
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # One release for both platforms. Created as a draft and flipped to
      # published only once every asset is attached - electron-updater reads
      # the newest published release, and it must never see one whose
      # latest*.yml or installers are still uploading. Re-run safe: a leftover
      # draft from a failed run is replaced; a published tag is never touched -
      # that version has shipped, so bump the version instead.
      - name: Create and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./apps/editor/package.json').version")"
          tag="v${version}"
          notes="apps/editor/release-notes/${version}.md"

          # Notes come from an in-repo file, like package releases - a release
          # can never ship without them. pnpm check:release-notes guards this
          # earlier, at commit time.
          test -f "$notes" || { echo "::error::Missing release notes: $notes"; exit 1; }

          if is_draft="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$is_draft" = "true" ]; then
              gh release delete "$tag" --yes
            else
              echo "::error::$tag is already published - bump apps/editor/package.json"
              exit 1
            fi
          fi

          # A draft carries no tag, but a stray one can be left behind (made
          # by hand, or by a published release that was later deleted).
          # gh release create reuses an existing tag and ignores --target, so
          # clear it - safe here, the published-release check above has passed.
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" 2>/dev/null || true

          gh release create "$tag" dist/* \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Soroush Editor v${version}" \
            --notes-file "$notes"

          gh release edit "$tag" --draft=false
